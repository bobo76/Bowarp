name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "agent-workspace-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/agent-workspace.exe, target/release/agentws-hook.exe $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-workspace-windows-x64
          path: agent-workspace-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-workspace-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: agent-workspace-windows-x64.zip
          generate_release_notes: true
