name: Ubuntu build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The release binary needs the build host's glibc or newer: build on the oldest supported
    # LTS, not ubuntu-latest (26.04's glibc 2.43 broke the app on 24.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev clang cmake

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Check glibc requirement
        run: |
          max=$(objdump -T target/release/agent-workspace target/release/agentws-hook \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Highest glibc symbol version: $max"
          if [ "$(printf '%s\n' "$max" GLIBC_2.39 | sort -V | tail -1)" != GLIBC_2.39 ]; then
            echo "::error::Binary needs $max; Ubuntu 24.04 ships GLIBC_2.39"
            exit 1
          fi

      # Branches reuse the release dependencies for speed; main keeps debug
      # assertions and overflow checks.
      - name: Test (release)
        if: github.ref != 'refs/heads/main'
        run: cargo test --release --workspace --locked

      - name: Test (debug)
        if: github.ref == 'refs/heads/main'
        run: cargo test --workspace --locked

      - name: Package
        run: |
          name=agent-workspace-linux-x64
          mkdir "$name" "$name/icons"
          cp target/release/agent-workspace target/release/agentws-hook \
            crates/app/installer/install.sh crates/app/assets/agent-workspace.desktop "$name"
          cp crates/app/assets/app-icon/*.png crates/app/assets/app-icon/*.svg "$name/icons"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          path: agent-workspace-linux-x64.tar.gz
          archive: false

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libvulkan-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev clang cmake

      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }

      - name: Rustfmt
        run: cargo fmt --all --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-workspace-linux-x64.tar.gz
          skip-decompress: true

      - uses: softprops/action-gh-release@v3
        with:
          files: agent-workspace-linux-x64.tar.gz
          generate_release_notes: true
