[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26"
log = "0.4"
parking_lot = "0.12"
futures = "0.3"
gpui-kit = "0.7"
term-core = { path = "crates/term-core" }
