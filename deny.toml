# cargo-deny configuration, checked by the `deny` job in .github/workflows/ubuntu.yml.
# Run locally with `cargo deny check` (install: `cargo install --locked cargo-deny`).

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported only when a workspace crate depends on them directly.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    # File-level copyleft, fine for unmodified dependencies (cbindgen, dwrote, option-ext).
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates set `publish = false` and carry no license.
ignore = true

[bans]
# Several versions of a crate are common in a GPUI dependency tree; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
